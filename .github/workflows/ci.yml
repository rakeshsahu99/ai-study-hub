name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-ci:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify Production Compilation
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://juwppanrmaxhwrgpseat.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_z3efnqgL0f8BYFWCMJbNlg_jnsI_wlZ
          NEXT_PUBLIC_API_BASE: http://localhost:8000

  backend-ci:
    name: Backend Syntax & Dependency Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Code Linters
        run: pip install flake8

      - name: Run Lint and Syntax Checks
        # Stop the build if there are syntax errors or undefined names
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
